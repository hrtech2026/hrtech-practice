name: Заявка на команду
description: Заявка на создание репозитория команды. Один Issue на команду.
title: "[Команда] "
labels: ["team-application"]
body:
  - type: markdown
    attributes:
      value: |
        Репозиторий команды создаёт преподаватель после проверки заявки.

        Заполните все поля. Несколько заявок от одной команды будут закрыты,
        отработает только первая.

        **Как это работает.** Бот сам найдёт вашу заявку, проверит её и
        напишет комментарий с составом, который он увидел. Преподаватель
        сверит его с журналом группы, при необходимости поправит поля
        прямо в этом Issue и добавит метку `provision` — после этого
        репозиторий создаётся автоматически, а каждому участнику из заявки
        GitHub отправляет письмо с приглашением.

        **Преподавателю ничего доделывать не нужно.** Единственное действие
        вручную — у участников: один раз нажать **Accept** в письме от GitHub.
        Членство в организации для работы не нужно.

        Состав можно изменить позже отдельной заявкой «Изменение состава».
        Правками в самом репозитории состав не меняется: права выдаются
        только по заявке.

  - type: input
    id: team-name
    attributes:
      label: Название команды
      description: От 3 до 60 символов. Так команда будет называться на витрине.
      placeholder: Онбординг 2.0
    validations:
      required: true

  - type: dropdown
    id: team-track
    attributes:
      label: Трек
      description: Предметная область вашего решения.
      options:
        - Найм
        - Онбординг
        - Выгорание
        - Оценка
        - Обучение
        - Прочее
    validations:
      required: true

  - type: input
    id: team-group
    attributes:
      label: Номер группы
      description: Например ИП-215.
      placeholder: ИП-215
    validations:
      required: true

  - type: input
    id: team-number
    attributes:
      label: Номер команды в группе
      description: Двузначное число. Определяет имя репозитория, team-<трек>-<NN>.
      placeholder: "03"
    validations:
      required: true

  - type: textarea
    id: team-members
    attributes:
      label: Участники (GitHub)
      description: >-
        От 3 до 5 логинов через запятую. Аккаунт должен существовать — этого
        достаточно. Каждому участнику GitHub отправит письмо с приглашением в
        репозиторий; нужно один раз нажать Accept в письме. Вступать в
        организацию не нужно.
      placeholder: ivanov, petrova, sidorova
    validations:
      required: true

  - type: input
    id: team-captain
    attributes:
      label: Капитан
      description: GitHub-логин капитана, он должен быть в списке участников.
      placeholder: ivanov
    validations:
      required: true

  - type: textarea
    id: team-concept
    attributes:
      label: Одно предложение о концепте
      description: До 200 символов. Публикуется на витрине проектов.
      placeholder: Единая точка входа в базу знаний с учётом роли сотрудника.
    validations:
      required: true

  - type: checkboxes
    id: team-acknowledgement
    attributes:
      label: Подтверждение
      options:
        - label: Состав соответствует журналу группы
          required: true
        - label: Участники создали аккаунты GitHub и согласятся принять приглашение в репозиторий
          required: true
        - label: Один участник не совмещает больше двух ролей
          required: true
